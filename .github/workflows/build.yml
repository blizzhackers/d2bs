name: Build D2BS.dll

on:
  push:
    branches: [master]
    # Release tags only (v1.6.5) and release candidates' (v1.6.5-rc.1); the build fails a tag that doesn't match VERSION.
    # In these filter patterns "+" means one or more of the character or [range] before it, and "." is a plain dot.
    tags: ['v[0-9]+.[0-9]+.[0-9]+', 'v[0-9]+.[0-9]+.[0-9]+-rc.[0-9]+']
  pull_request:
  workflow_dispatch:
  schedule:
    # Three times a week, so the toolset cache (removed after 7 days without use) stays on master even if a
    # scheduled run starts late or is dropped.
    - cron: '23 4 * * 1,3,5'

permissions:
  contents: read

concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  build:
    runs-on: windows-2025
    timeout-minutes: 45
    outputs:
      start-tag: ${{ steps.notes.outputs.start-tag }}
    steps:
      # A pull request builds its head commit, not GitHub's temporary merge commit, so the commit stamped into the
      # DLL and the artifact's name is one that exists on the branch.
      - uses: actions/checkout@v7 # floating major; v7.0.1 was current on 2026-10-15
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}

      # A release tag's notes are its CHANGELOG.md section. The tag fails here, before the build, when the section is
      # missing, has no entries, or has an HTML comment or code fence that never closes. The step's start-tag output
      # is where the release's generated list of pull requests starts.
      - name: Release notes
        id: notes
        if: github.ref_type == 'tag'
        shell: pwsh
        env:
          REF_NAME: ${{ github.ref_name }}
        run: ./build/Get-ReleaseNotes.ps1 -Version $env:REF_NAME -OutFile "$env:RUNNER_TEMP/out/release-notes.md"

      # The Visual C++ 2010 SP1 toolset, unpacked from Microsoft's downloads on a cache miss. The key changes
      # whenever the package list or the unpacking does.
      - name: Restore the VC++ 2010 toolset
        id: toolset
        uses: actions/cache/restore@v6 # floating major; v6.1.0 was current on 2026-10-15
        with:
          path: ${{ runner.temp }}/toolset
          key: vc100-sp1-${{ hashFiles('build/toolset.json', 'build/Get-Toolset.ps1') }}

      - name: Fetch the toolset from Microsoft
        if: steps.toolset.outputs.cache-hit != 'true'
        shell: pwsh
        run: ./build/Get-Toolset.ps1 -Out "$env:RUNNER_TEMP/toolset"

      # Saved before the build, so a build that fails still leaves the toolset cached.
      - name: Save the toolset
        if: steps.toolset.outputs.cache-hit != 'true'
        uses: actions/cache/save@v6 # floating major; v6.1.0 was current on 2026-10-15
        with:
          path: ${{ runner.temp }}/toolset
          key: ${{ steps.toolset.outputs.cache-primary-key }}

      - name: Build
        id: build
        shell: pwsh
        env:
          REF_TYPE: ${{ github.ref_type }}
          REF_NAME: ${{ github.ref_name }}
          RUN_NUMBER: ${{ github.run_number }}
        run: |
          # The last file-version number: the run number, 1-65535, for dev builds and release candidates (0 is reserved
          # for final releases).
          $build = @{ Toolset = "$env:RUNNER_TEMP/toolset"; Out = "$env:RUNNER_TEMP/out"; BuildNumber = 1 + ([int]$env:RUN_NUMBER - 1) % 65535 }
          if ($env:REF_TYPE -eq 'tag') { $build.Release = $true; $build.Tag = $env:REF_NAME }
          ./build/Build-D2BS.ps1 @build

      # A release's zip for a bot folder: its d2bs folder, extracted into kolbot's, replaces D2BS.dll and CHANGELOG.md
      # where kolbot keeps them and adds D2BS.pdb beside them. Entry names are spelled with "/" so every unzip tool
      # makes the folder.
      - name: Package
        if: github.ref_type == 'tag'
        shell: pwsh
        env:
          REF_NAME: ${{ github.ref_name }}
        run: |
          Add-Type -AssemblyName System.IO.Compression.FileSystem
          $out = "$env:RUNNER_TEMP/out"
          $zip = [IO.Compression.ZipFile]::Open("$out/D2BS-$env:REF_NAME.zip", 'Create')
          try {
            foreach ($file in "$out/D2BS.dll", "$out/D2BS.pdb", "$env:GITHUB_WORKSPACE/CHANGELOG.md") {
              [IO.Compression.ZipFileExtensions]::CreateEntryFromFile($zip, $file, "d2bs/$(Split-Path -Leaf $file)", 'Optimal') | Out-Null
            }
          } finally { $zip.Dispose() }

      - uses: actions/upload-artifact@v7 # floating major; v7.0.2 was current on 2026-10-15
        with:
          name: D2BS-${{ github.ref_type == 'tag' && github.ref_name || github.event.pull_request.head.sha || github.sha }}
          path: |
            ${{ runner.temp }}/out/D2BS.dll
            ${{ runner.temp }}/out/D2BS.pdb
            ${{ runner.temp }}/out/build.log
            ${{ runner.temp }}/out/release-notes.md
            ${{ runner.temp }}/out/D2BS-*.zip
          if-no-files-found: error
          retention-days: ${{ github.ref_type == 'tag' && 90 || 30 }}
          overwrite: true # a re-run replaces the earlier attempt's artifact

      # A failed build keeps its whole log (the job log shows only the failing tool's errors and last lines), under a
      # name of its own so the release job never takes it for a build.
      - name: Upload the build log of a failed build
        if: failure() && steps.build.outcome == 'failure'
        uses: actions/upload-artifact@v7 # floating major; v7.0.2 was current on 2026-10-15
        with:
          name: D2BS-build-log-${{ github.ref_type == 'tag' && github.ref_name || github.event.pull_request.head.sha || github.sha }}
          path: ${{ runner.temp }}/out/build.log
          if-no-files-found: ignore
          retention-days: 30
          overwrite: true

  release:
    # Only a pushed release tag: a manual run on a tag builds it but makes no second release.
    if: github.event_name == 'push' && github.ref_type == 'tag'
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v8 # floating major; v8.0.2 was current on 2026-10-15
        with:
          name: D2BS-${{ github.ref_name }}
          path: dist

      - name: Create the release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.ref_name }}
          START_TAG: ${{ needs.build.outputs.start-tag }}
        # A release candidate is published at once as a pre-release, never Latest, for testers. A final is a draft,
        # published by hand after a smoke test (build/Release-D2BS.ps1 prints the command). The CHANGELOG.md notes come
        # first, then GitHub's generated list of pull requests and its compare link, starting at START_TAG. GitHub
        # refuses a start tag that no longer exists (a tag deleted after a failed build) with HTTP 400, so a tag the
        # API reports missing (404) is left out and GitHub picks the start, as it does when START_TAG is empty; when
        # the check itself fails, the tag is passed anyway.
        run: |
          kind=(--draft)
          case "$TAG" in *-rc.*) kind=(--prerelease --latest=false) ;; esac
          start=()
          if [ -n "$START_TAG" ]; then
            if err=$(gh api "repos/$GITHUB_REPOSITORY/git/ref/tags/$START_TAG" --silent 2>&1); then start=(--notes-start-tag "$START_TAG")
            elif [[ $err == *"HTTP 404"* ]]; then echo "::warning::$START_TAG, where CHANGELOG.md's compare link for $TAG starts, is no tag: GitHub picks where the list of pull requests starts"
            else
              # A workflow command is one line, with % escaped.
              err=${err//'%'/'%25'}; err=${err//$'\r'/}; err=${err//$'\n'/ }
              echo "::warning::could not check that $START_TAG exists ($err); starting the list of pull requests there anyway"
              start=(--notes-start-tag "$START_TAG")
            fi
          fi
          gh release create "$TAG" dist/D2BS.dll dist/D2BS.pdb "dist/D2BS-$TAG.zip" --repo "$GITHUB_REPOSITORY" --verify-tag "${kind[@]}" --title "D2BS $TAG" --notes-file dist/release-notes.md --generate-notes "${start[@]}"
